# Rime schema
# encoding: utf-8
#
# French input with a Chinese gloss for each candidate. Codes are the spelling
# of the word without accents: élève -> eleve, cœur -> coeur, peut-être ->
# peutetre; the apostrophe is typed (j'ai -> j' then ai, aujourd'hui or
# aujourdhui). The dictionary is generated by tools/build_frwiktionary.py;
# install with install-french.py. Part of rime-german-gloss.

schema:
  schema_id: francais
  name: 法语
  version: "1.0"
  description: |
    法语输入，候选显示中文释义。输入不带重音的拼写（eleve → élève），撇号照打（j'ai）。
    词表与释义来自法语维基词典（kaikki.org）与 CFDICT。

switches:
  - name: ascii_mode
    reset: 0
    states: [ Français, ABC ]

# Like deutsch: no punctuator or recognizer, so a punctuation key commits the
# candidate and then reaches the application unchanged, and Shift+letter
# reaches german_keys. The apostrophe is a letter of the codes instead.
engine:
  processors:
    - ascii_composer
    - key_binder
    - lua_processor@*german_keys
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier
    - lua_filter@*german_gloss@fr_zh
    - lua_filter@*german_case

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz'"
  delimiter: " "

translator:
  dictionary: francais
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: false
  encode_commit_history: false
  # Drop the "~rest-of-code" hint of completions; the comment is the Chinese gloss.
  comment_format:
    - xform/^~.*$//

# Schema and mode switches only. Add your own in francais.custom.yaml:
#   patch:
#     key_binder/bindings/+:
#       - {accept: "Control+Shift+h", select: cangjie5, when: always}
key_binder:
  bindings:
    - {accept: "Control+Shift+1", select: .next, when: always}
    - {accept: "Control+Shift+exclam", select: .next, when: always}
    - {accept: "Control+Shift+2", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+at", toggle: ascii_mode, when: always}

# fr_zh.user.tsv holds your own entries (same format) and overrides fr_zh.tsv.
fr_zh:
  dictionary: french_input/fr_zh.user.tsv
  base_dictionary: french_input/fr_zh.tsv
  opencc_config: none
  max_length: 100
