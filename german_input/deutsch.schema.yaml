# Rime schema
# encoding: utf-8
#
# German input with a Chinese gloss for each candidate. Codes are the ASCII
# spelling of the word: müde -> muede (or mude), Straße -> strasse.
# The dictionary is generated by tools/build_dewiktionary.py; install with
# install-german.py. Part of rime-german-gloss.

schema:
  schema_id: deutsch
  name: 德语
  version: "1.0"
  description: |
    德语输入，候选显示中文释义。变音按 ae/oe/ue/ss 或不带变音的字母输入。
    词表与释义来自德语维基词典（kaikki.org）与 HanDeDict。

switches:
  - name: ascii_mode
    reset: 0
    states: [ Deutsch, ABC ]

# No punctuator or recognizer: a punctuation key commits the candidate and
# then reaches the application unchanged (express_editor), and the
# recognizer's uppercase pattern would take Shift+letter away from
# german_keys. key_binder has its own bindings below, not the default ones,
# which page with "-" and "=".
engine:
  processors:
    - ascii_composer
    - key_binder
    - lua_processor@*german_keys
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier
    - lua_filter@*german_gloss@de_zh
    - lua_filter@*german_case

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"

translator:
  dictionary: deutsch
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: false
  encode_commit_history: false
  # Drop the "~rest-of-code" hint of completions; the comment is the Chinese gloss.
  comment_format:
    - xform/^~.*$//

# Schema and mode switches only. Add your own in deutsch.custom.yaml:
#   patch:
#     key_binder/bindings/+:
#       - {accept: "Control+Shift+h", select: cangjie5, when: always}
key_binder:
  bindings:
    - {accept: "Control+Shift+1", select: .next, when: always}
    - {accept: "Control+Shift+exclam", select: .next, when: always}
    - {accept: "Control+Shift+2", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+at", toggle: ascii_mode, when: always}

# de_zh.user.tsv holds your own entries (same format) and overrides de_zh.tsv.
de_zh:
  dictionary: german_input/de_zh.user.tsv
  base_dictionary: german_input/de_zh.tsv
  opencc_config: none
  max_length: 100
